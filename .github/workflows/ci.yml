name: VizArc CI & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & Package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps
          pip install pytest

      - name: Check Python Bytecode & SyntaxWarnings
        run: python -W error::SyntaxWarning -m compileall -q src cli.py app.py shared tests

      - name: Validate Cross-Platform Agent Skills
        run: python shared/scripts/validate_skills.py

      - name: Run Pytest Suite
        run: pytest -v

      - name: Run Offline CLI, Layout QA & Browser Check
        run: |
          vizarc doctor
          vizarc templates
          vizarc template ecommerce-platform --format all -o ./ci_out
          vizarc validate ./ci_out/ecommerce-platform.html
          vizarc browser-check ./ci_out/ecommerce-platform.html
          vizarc template serverless-aws --format html -o ./ci_out/serverless-aws.html
          vizarc compare ./ci_out/ecommerce-platform.html ./ci_out/serverless-aws.html --format html -o ./ci_out/architecture_diff.html
          vizarc diagnose .

      - name: Upload Verified Sample Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vizarc-ci-samples
          path: ci_out/

name: VizArc Architecture Diagram Generator

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  generate-diagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Architecture Specification
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr ? pr.body || "" : "";
            const match = body.match(/```vizarc\s*([\s\S]*?)```/);
            const prompt = match ? match[1].trim() : "System architecture overview of recent pull request changes";
            core.setOutput('prompt', prompt);

      - name: Generate Architecture Diagram SVG & HTML
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: src
        run: |
          PROMPT="${{ steps.extract.outputs.prompt }}"
          echo "Generating architecture diagram for prompt: $PROMPT"
          python cli.py generate "$PROMPT" --format svg -o pr-architecture.svg
          python cli.py generate "$PROMPT" --format html -o pr-architecture.html

      - name: Upload Architecture Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vizarc-diagrams
          path: |
            pr-architecture.svg
            pr-architecture.html

      - name: Post Architecture Diagram Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const svgContent = fs.existsSync('pr-architecture.svg') ? fs.readFileSync('pr-architecture.svg', 'utf8') : '';
            
            const commentBody = `### 📐 VizArc Architecture Diagram
> Automatically compiled from PR description using **[VizArc](https://github.com/nitinriaan/vizarc)**.

\`\`\`xml
${svgContent.slice(0, 500)}...
\`\`\`

📁 **Full Artifacts Available:**
- Download \`pr-architecture.svg\` vector graphic from GitHub Actions run.
- Download \`pr-architecture.html\` interactive 3D canvas with path tracing and zoom.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
